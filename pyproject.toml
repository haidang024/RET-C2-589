[project]
name = "ret-c2-589"
version = "1.0.1"
description = "Retail Part-Time Resume Screening Agent"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# provided by CI per repo arm,
# or installed from the package registry for wheel-era repos (see the dual-mode
# run-tests job in CI). Pinning it here would make `pip install -e .`
# fail because it is not resolvable from the default index.

# pyyaml is a runtime dependency because the PB-7 applicability check reads
# config/config.yaml in every deployed template.
dependencies = [
    "agenticstar-agentcore[marketplace,openai,platform-rag,platform-memory,platform-db,platform-storage-azure]==1.0.3",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
allow_subclassing_any = true
disallow_untyped_decorators = false
